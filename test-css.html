<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试CSS</title>
  <style>
    /* ========== 全局重置与基础变量 ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Apple官方配色体系 */
      --accent-blue: #0071e3;
      --accent-blue-hover: #0077ed;
      --text-primary: #1d1d1f;
      --text-secondary: #86868b;
      --text-tertiary: #6e6e73;
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f7;
      --bg-tertiary: #fbfbfd;
      --border-color: #d2d2d7;
      --border-light: rgba(0, 0, 0, 0.08);
      
      /* 全局玻璃效果 - 默认主题 */
      --glass-bg: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(0, 0, 0, 0.1);
      --glass-blur: 20px;
      
      /* 卡片阴影 */
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      --card-shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.15);
      
      /* 展示区渐变 - 默认主题使用蓝紫渐变 */
      --display-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      
      /* 强调色渐变 */
      --accent-gradient: linear-gradient(135deg, var(--accent-blue) 0%, #5856d6 100%);
    }

    /* 全局主题A：Silver Glass - 暖灰中性色 */
    [data-theme-style="silver"] {
      --glass-bg: rgba(255, 255, 255, 0.9);
      --glass-border: rgba(0, 0, 0, 0.06);
      --glass-blur: 12px;
      --card-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      --card-shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.08);
      --display-gradient: linear-gradient(135deg, #f5f0eb 0%, #ebe6e1 50%, #f0ebe6 100%);
      --accent-gradient: linear-gradient(135deg, #8e8e93 0%, #636366 100%);
    }

    /* 全局主题B：Apple Blue Glass - 浅蓝玻璃 */
    [data-theme-style="blue"] {
      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(0, 113, 227, 0.12);
      --glass-blur: 16px;
      --card-shadow: 0 4px 16px rgba(0, 113, 227, 0.06);
      --card-shadow-hover: 0 12px 40px rgba(0, 113, 227, 0.12);
      --display-gradient: linear-gradient(135deg, rgba(0,113,227,0.08) 0%, rgba(90,200,250,0.12) 50%, rgba(0,113,227,0.06) 100%);
      --accent-gradient: linear-gradient(135deg, #0071e3 0%, #00c7ff 100%);
    }

    /* 深色模式变量 - 参考macOS Dark Mode */
    [data-theme="dark"] {
      /* 主色调 */
      --accent-blue: #0a84ff;
      --accent-blue-hover: #409cff;
      
      /* 文字颜色 */
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1a6;
      --text-tertiary: #86868b;
      
      /* 背景层次 */
      --bg-primary: #1c1c1e;
      --bg-secondary: #2c2c2e;
      --bg-tertiary: #3a3a3c;
      --bg-elevated: #48484a;
      
      /* 边框颜色 */
      --border-color: #38383a;
      --border-light: rgba(255, 255, 255, 0.06);
      
      /* 玻璃效果 - 深色默认 */
      --glass-bg: rgba(44, 44, 46, 0.72);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-blur: 20px;
      
      /* 卡片阴影 */
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      --card-shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.4);
      
      /* 展示区渐变 - 深色默认使用深紫渐变 */
      --display-gradient: linear-gradient(135deg, #2d1b69 0%, #1a1a2e 50%, #0f3460 100%);
      
      /* 强调色渐变 */
      --accent-gradient: linear-gradient(135deg, #0a84ff 0%, #5856d6 100%);
    }

    /* 深色模式主题A：Silver Glass */
    [data-theme="dark"][data-theme-style="silver"] {
      --glass-bg: rgba(44, 44, 46, 0.85);
      --glass-border: rgba(255, 255, 255, 0.08);
      --display-gradient: linear-gradient(135deg, #2c2c2e 0%, #3a3a3c 50%, #2c2c2e 100%);
      --accent-gradient: linear-gradient(135deg, #a1a1a6 0%, #86868b 100%);
    }

    /* 深色模式主题B：Apple Blue Glass */
    [data-theme="dark"][data-theme-style="blue"] {
      --glass-bg: rgba(44, 44, 46, 0.8);
      --glass-border: rgba(10, 132, 255, 0.15);
      --card-shadow: 0 4px 20px rgba(10, 132, 255, 0.15);
      --card-shadow-hover: 0 12px 40px rgba(10, 132, 255, 0.25);
      --display-gradient: linear-gradient(135deg, rgba(10,132,255,0.12) 0%, rgba(88,86,214,0.1) 50%, rgba(10,132,255,0.08) 100%);
      --accent-gradient: linear-gradient(135deg, #0a84ff 0%, #5e5ce6 100%);
    }

    /* 圆角规范 */
    :root {
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 28px;
      --radius-2xl: 40px;
      
      /* 间距规范 */
      --gap-xs: 8px;
      --gap-sm: 16px;
      --gap-md: 24px;
      --gap-lg: 48px;
      --gap-xl: 80px;
      --gap-2xl: 120px;
      
      /* 动画时间 */
      --transition-fast: 0.2s ease;
      --transition-normal: 0.3s ease;
      --transition-slow: 0.5s cubic-bezier(0.28, 0.11, 0.32, 1);
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", 
                   "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      color: var(--text-primary);
      background: var(--bg-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* ========== 页面加载动画（已禁用） ========== */
    .page-loader {
      display: none !important;
    }
      opacity: 0;
      animation: fadeIn 0.4s ease 0.3s forwards;
    }

    .loader-bar::after {
      content: '';
      display: block;
      width: 0%;
      height: 100%;
      background: var(--text-primary);
      border-radius: 2px;
      animation: loading 1.5s ease-in-out forwards;
    }

    @keyframes loading {
      0% { width: 0%; }
      50% { width: 70%; }
      100% { width: 100%; }
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ========== 毛玻璃导航栏 ========== */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      z-index: 1000;
      background: var(--glass-bg);
      backdrop-filter: saturate(180%) blur(var(--glass-blur));
      -webkit-backdrop-filter: saturate(180%) blur(var(--glass-blur));
      border-bottom: 1px solid var(--glass-border);
      transform: translateY(-100%);
      animation: slideDown 0.6s ease 1.4s forwards;
    }

    @keyframes slideDown {
      to { transform: translateY(0); }
    }

    .nav-container {
      max-width: 1200px;
      height: 100%;
      margin: 0 auto;
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      font-size: 13px;
      color: var(--text-primary);
      text-decoration: none;
      opacity: 0.8;
      transition: opacity var(--transition-fast);
      letter-spacing: -0.2px;
    }

    .nav-links a:hover {
      opacity: 1;
    }

    .nav-cta {
      padding: 8px 18px;
      background: var(--accent-blue);
      color: white !important;
      border-radius: 980px;
      opacity: 1 !important;
      transition: background var(--transition-fast) !important;
    }

    .nav-cta:hover {
      background: var(--accent-blue-hover);
    }

    /* ========== 通用Section样式 ========== */
    .section {
      padding: var(--gap-2xl) 0;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .section-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 40px;
    }

    .section-header {
      text-align: center;
      margin-bottom: var(--gap-xl);
    }

    .section-eyebrow {
      font-size: 17px;
      font-weight: 600;
      color: var(--accent-blue);
      letter-spacing: -0.3px;
      margin-bottom: 8px;
    }

    .section-title {
      font-size: 56px;
      font-weight: 600;
      letter-spacing: -2px;
      line-height: 1.1;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    .section-subtitle {
      font-size: 21px;
      color: var(--text-secondary);
      letter-spacing: -0.3px;
      line-height: 1.5;
      max-width: 600px;
      margin: 0 auto;
    }

    /* ========== Hero首屏 ========== */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 52px;
      background: var(--bg-primary);
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 50%, rgba(0, 113, 227, 0.03) 0%, transparent 50%),
                  radial-gradient(circle at 70% 50%, rgba(88, 86, 214, 0.03) 0%, transparent 50%);
      animation: heroGlow 20s ease-in-out infinite alternate;
    }

    @keyframes heroGlow {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-5%, 5%); }
    }

    .hero-content {
      text-align: center;
      position: relative;
      z-index: 1;
      padding: 0 40px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg-secondary);
      border-radius: 980px;
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 32px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s ease 1.6s forwards;
    }

    .hero-badge-dot {
      width: 8px;
      height: 8px;
      background: #34c759;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .hero-title {
      font-size: 80px;
      font-weight: 600;
      letter-spacing: -4px;
      line-height: 1.05;
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 0.8s ease 1.8s forwards;
    }

    .hero-title-gradient {
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-blue) 50%, var(--accent-blue) 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 8s ease-in-out infinite;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .hero-subtitle {
      font-size: 28px;
      font-weight: 400;
      color: var(--text-secondary);
      margin-bottom: 16px;
      letter-spacing: -0.5px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s ease 2s forwards;
    }

    .hero-description {
      font-size: 19px;
      color: var(--text-tertiary);
      max-width: 500px;
      margin: 0 auto 40px;
      line-height: 1.6;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s ease 2.2s forwards;
    }

    .hero-cta {
      display: flex;
      gap: 16px;
      justify-content: center;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s ease 2.4s forwards;
    }

    .hero-scroll-indicator {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      animation: fadeIn 0.8s ease 2.8s forwards;
    }

    .scroll-mouse {
      width: 24px;
      height: 36px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      position: relative;
    }

    .scroll-mouse::after {
      content: '';
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 8px;
      background: var(--text-secondary);
      border-radius: 2px;
      animation: scrollDown 2s ease-in-out infinite;
    }

    @keyframes scrollDown {
      0% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(12px); }
    }

    .scroll-text {
      font-size: 12px;
      color: var(--text-secondary);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ========== 按钮样式 ========== */
    .btn-primary {
      padding: 14px 28px;
      background: var(--accent-blue);
      color: white;
      border: none;
      border-radius: 980px;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-normal);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--card-shadow);
    }

    .btn-primary:hover {
      background: var(--accent-blue-hover);
      transform: translateY(-2px);
      box-shadow: var(--card-shadow-hover);
    }

    .btn-secondary {
      padding: 14px 28px;
      background: transparent;
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
      border-radius: 980px;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-normal);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-secondary:hover {
      background: rgba(0, 113, 227, 0.05);
      transform: translateY(-2px);
    }

    .btn-icon {
      font-size: 20px;
      transition: transform var(--transition-fast);
    }

    .btn-primary:hover .btn-icon,
    .btn-secondary:hover .btn-icon {
      transform: translateX(4px);
    }

    /* ========== 项目展示区 ========== */
    .projects {
      background: var(--bg-secondary);
    }

    .project-showcase {
      display: flex;
      flex-direction: column;
      gap: var(--gap-2xl);
    }

    .project-item {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap-xl);
      align-items: center;
    }

    .project-item.reverse {
      direction: rtl;
    }

    .project-item.reverse > * {
      direction: ltr;
    }

    .project-visual {
      position: relative;
      border-radius: var(--radius-xl);
      overflow: hidden;
      background: var(--display-gradient);
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: var(--card-shadow);
    }

    .project-visual:hover {
      transform: translateY(-3px);
      box-shadow: var(--card-shadow-hover);
    }

    .project-visual-content {
      position: relative;
      z-index: 1;
      text-align: center;
      color: white;
      padding: 40px;
    }

    .project-visual-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      display: block;
      color: white;
    }

    .project-visual-title {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .project-visual::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 30% 30%, rgba(0, 113, 227, 0.3) 0%, transparent 60%);
    }

    .project-info {
      padding: 20px 0;
    }

    .project-category {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .project-title {
      font-size: 40px;
      font-weight: 600;
      letter-spacing: -1.5px;
      line-height: 1.15;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    .project-description {
      font-size: 17px;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .project-tag {
      padding: 6px 14px;
      background: rgba(0, 113, 227, 0.08);
      color: var(--accent-blue);
      border-radius: 980px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.2px;
    }

    .project-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-blue);
      font-size: 17px;
      font-weight: 500;
      text-decoration: none;
      transition: gap var(--transition-fast);
    }

    .project-link:hover {
      gap: 12px;
    }

    .project-link-arrow {
      font-size: 20px;
      transition: transform var(--transition-fast);
    }

    .project-link:hover .project-link-arrow {
      transform: translateX(4px);
    }

    /* ========== 技术能力展示 ========== */
    .skills {
      background: var(--bg-primary);
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .skill-card {
      padding: 40px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
      box-shadow: var(--card-shadow);
    }

    .skill-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(0, 113, 227, 0.02) 0%, rgba(88, 86, 214, 0.02) 100%);
      opacity: 0;
      transition: opacity var(--transition-normal);
    }

    .skill-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--card-shadow-hover);
    }

    .skill-card:hover::before {
      opacity: 1;
    }

    .skill-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }

    .skill-icon svg {
      width: 28px;
      height: 28px;
      color: white;
    }

    .skill-title {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      color: var(--text-primary);
      position: relative;
      z-index: 1;
    }

    .skill-description {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      position: relative;
      z-index: 1;
    }

    .skill-tag {
      padding: 6px 12px;
      background: var(--bg-secondary);
      border-radius: 980px;
      font-size: 13px;
      color: var(--text-secondary);
      letter-spacing: -0.2px;
    }

    /* ========== 个人信息 ========== */
    .about {
      background: var(--bg-secondary);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: var(--gap-xl);
    }

    .about-main h3 {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -1px;
      margin-bottom: 24px;
      color: var(--text-primary);
    }

    .about-text {
      font-size: 17px;
      color: var(--text-secondary);
      line-height: 1.8;
      margin-bottom: 32px;
    }

    .about-highlights {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .highlight-item {
      padding: 24px;
      background: white;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
    }

    .highlight-number {
      font-size: 36px;
      font-weight: 600;
      color: var(--accent-blue);
      letter-spacing: -1px;
      margin-bottom: 4px;
    }

    .highlight-label {
      font-size: 15px;
      color: var(--text-secondary);
    }

    .about-sidebar {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .sidebar-section {
      padding: 32px;
      background: white;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
    }

    .sidebar-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 20px;
      letter-spacing: -0.3px;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .timeline-item {
      position: relative;
      padding-left: 20px;
      border-left: 2px solid var(--border-color);
    }

    .timeline-item:last-child {
      border-left-color: transparent;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -5px;
      top: 4px;
      width: 8px;
      height: 8px;
      background: var(--accent-blue);
      border-radius: 50%;
    }

    .timeline-date {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .timeline-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .timeline-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      text-decoration: none;
      color: var(--text-primary);
      font-size: 15px;
      transition: all var(--transition-fast);
    }

    .link-item:hover {
      background: var(--accent-blue);
      color: white;
    }

    .link-icon {
      font-size: 20px;
    }

    /* ========== 页脚 ========== */
    .footer {
      background: var(--bg-primary);
      padding: 48px 0 32px;
      border-top: 1px solid var(--border-color);
    }

    .footer-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 40px;
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 48px;
    }

    .footer-brand {
      max-width: 300px;
    }

    .footer-logo {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    .footer-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .footer-links {
      display: flex;
      gap: 80px;
    }

    .footer-column h4 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    .footer-column ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .footer-column a {
      font-size: 14px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    .footer-column a:hover {
      color: var(--text-primary);
    }

    .footer-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 32px;
      border-top: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-urls {
      display: flex;
      gap: 20px;
    }

    .footer-urls a {
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    .footer-urls a:hover {
      color: var(--accent-blue);
    }

    .footer-copyright {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .footer-legal {
      display: flex;
      gap: 24px;
    }

    .footer-legal a {
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    .footer-legal a:hover {
      color: var(--text-primary);
    }

    /* ========== AI助手按钮 ========== */
    .ai-assistant {
      position: fixed;
      bottom: 32px;
      right: 32px;
      z-index: 999;
    }

    .ai-button {
      width: 60px;
      height: 60px;
      background: var(--accent-gradient);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--card-shadow-hover);
      transition: all var(--transition-normal);
      position: relative;
      overflow: hidden;
    }

    .ai-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 100%);
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    .ai-button:hover {
      transform: scale(1.1);
      box-shadow: var(--card-shadow-hover);
    }

    .ai-button:hover::before {
      opacity: 1;
    }

    .ai-button-icon {
      font-size: 28px;
      color: white;
      position: relative;
      z-index: 1;
      transition: transform var(--transition-fast);
    }

    .ai-button:hover .ai-button-icon {
      transform: scale(1.1);
    }

    .ai-button-pulse {
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      border: 2px solid var(--accent-blue);
      border-radius: 50%;
      animation: aiPulse 2s ease-out infinite;
    }

    @keyframes aiPulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .ai-chat-window {
      position: absolute;
      bottom: 80px;
      right: 0;
      width: 380px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-radius: var(--radius-xl);
      box-shadow: var(--card-shadow-hover);
      border: 1px solid var(--glass-border);
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px) scale(0.95);
      transition: all var(--transition-normal);
    }

    .ai-chat-window.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .ai-chat-header {
      padding: 20px 24px;
      background: var(--accent-gradient);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ai-chat-header-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .ai-chat-close {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 16px;
      transition: background var(--transition-fast);
    }

    .ai-chat-close:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .ai-chat-messages {
      padding: 24px;
      height: 300px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .ai-message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      animation: messageIn 0.3s ease;
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ai-message.bot {
      background: var(--bg-secondary);
      color: var(--text-primary);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .ai-message.user {
      background: var(--accent-blue);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .ai-chat-input-area {
      padding: 16px 24px;
      border-top: 1px solid var(--border-light);
      display: flex;
      gap: 12px;
    }

    .ai-chat-input {
      flex: 1;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 980px;
      font-size: 15px;
      color: var(--text-primary);
      outline: none;
      transition: border-color var(--transition-fast);
    }

    .ai-chat-input:focus {
      border-color: var(--accent-blue);
    }

    .ai-chat-input::placeholder {
      color: var(--text-secondary);
    }

    .ai-chat-send {
      width: 44px;
      height: 44px;
      background: var(--accent-blue);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      transition: all var(--transition-fast);
    }

    .ai-chat-send:hover {
      background: var(--accent-blue-hover);
      transform: scale(1.05);
    }

    .ai-chat-send:disabled {
      background: var(--border-color);
      cursor: not-allowed;
      transform: none;
    }

    .ai-quick-actions {
      padding: 0 24px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .ai-quick-btn {
      padding: 8px 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 980px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .ai-quick-btn:hover {
      background: var(--accent-blue);
      color: white;
      border-color: var(--accent-blue);
    }

    /* AI加载动画 */
    .ai-message.loading {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .loading-dots::after {
      content: '';
      animation: loadingDots 1.5s infinite;
    }

    @keyframes loadingDots {
      0% { content: '.'; }
      33% { content: '..'; }
      66% { content: '...'; }
    }

    /* ========== 响应式适配 ========== */
    @media (max-width: 1024px) {
      .hero-title {
        font-size: 64px;
        letter-spacing: -3px;
      }

      .section-title {
        font-size: 44px;
      }

      .project-item {
        grid-template-columns: 1fr;
        gap: var(--gap-lg);
      }

      .project-item.reverse {
        direction: ltr;
      }

      .about-grid {
        grid-template-columns: 1fr;
      }

      .footer-links {
        gap: 40px;
      }
    }

    @media (max-width: 768px) {
      .hero-title {
        font-size: 48px;
        letter-spacing: -2px;
      }

      .hero-subtitle {
        font-size: 22px;
      }

      .section {
        padding: var(--gap-xl) 0;
      }

      .section-title {
        font-size: 36px;
        letter-spacing: -1.5px;
      }

      .section-subtitle {
        font-size: 17px;
      }

      .nav-links {
        display: none;
      }

      .skills-grid {
        grid-template-columns: 1fr;
      }

      .about-highlights {
        grid-template-columns: 1fr;
      }

      .footer-top {
        flex-direction: column;
        gap: 32px;
      }

      .footer-links {
        flex-direction: column;
        gap: 32px;
      }

      .footer-bottom {
        flex-direction: column;
        gap: 16px;
        text-align: center;
      }

      .ai-chat-window {
        width: calc(100vw - 32px);
        right: -16px;
      }
    }

    /* 手机端适配 - 480px以下 */
    @media (max-width: 480px) {
      .hero {
        padding-top: 80px;
        padding-bottom: 60px;
      }

      .hero-title {
        font-size: 36px;
        letter-spacing: -1.5px;
      }

      .hero-subtitle {
        font-size: 20px;
      }

      .hero-description {
        font-size: 16px;
        padding: 0 16px;
      }

      .hero-cta {
        flex-direction: column;
        gap: 12px;
        padding: 0 16px;
      }

      .btn-primary, .btn-secondary {
        width: 100%;
        justify-content: center;
      }

      .section {
        padding: 60px 0;
      }

      .section-title {
        font-size: 28px;
      }

      .section-container {
        padding: 0 16px;
      }

      .project-item {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .project-visual {
        aspect-ratio: 16/10;
      }

      .project-title {
        font-size: 24px;
      }

      .project-description {
        font-size: 15px;
      }

      .skill-card {
        padding: 20px;
      }

      .skill-title {
        font-size: 20px;
      }

      .about-grid {
        gap: 24px;
      }

      .about-text {
        font-size: 15px;
      }

      .highlight-number {
        font-size: 24px;
      }

      .nav-container {
        padding: 0 16px;
      }

      .nav-logo {
        font-size: 18px;
      }

      .footer-container {
        padding: 0 16px;
      }

      .footer-desc {
        font-size: 13px;
      }

      .ai-button {
        width: 48px;
        height: 48px;
        bottom: 16px;
        right: 16px;
      }

      .ai-button-icon {
        font-size: 22px;
      }

      .ai-chat-window {
        width: calc(100vw - 16px);
        right: -8px;
        bottom: 64px;
        border-radius: 16px;
      }

      .ai-chat-messages {
        height: 250px;
      }

      .sidebar-section {
        padding: 20px;
      }
    }

    /* 触摸设备优化 */
    @media (hover: none) {
      .project-visual:hover {
        transform: none;
      }

      .skill-card:hover {
        transform: none;
        box-shadow: none;
      }

      .product-card:hover {
        transform: none;
      }
    }

    /* ========== 深色模式切换按钮 ========== */
    .theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 20px;
      padding: 4px;
      opacity: 0.8;
      transition: opacity var(--transition-fast);
    }
    .theme-toggle:hover {
      opacity: 1;
    }

    /* 主题样式切换按钮 */
    .theme-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .theme-style-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .theme-style-btn:hover {
      background: var(--accent-blue);
      color: white;
      border-color: var(--accent-blue);
    }
    .theme-style-btn.active {
      background: var(--accent-blue);
      color: white;
      border-color: var(--accent-blue);
    }

    /* ========== 深色模式样式覆盖 ========== */
    [data-theme="dark"] .navbar {
      background: var(--glass-bg);
      backdrop-filter: saturate(180%) blur(var(--glass-blur));
      -webkit-backdrop-filter: saturate(180%) blur(var(--glass-blur));
      border-bottom-color: var(--glass-border);
    }
    [data-theme="dark"] .hero::before {
      background: radial-gradient(circle at 30% 50%, rgba(41, 38, 61, 0.3) 0%, transparent 50%),
                  radial-gradient(circle at 70% 50%, rgba(41, 38, 61, 0.2) 0%, transparent 50%);
    }
    [data-theme="dark"] .skill-card {
      /* 使用CSS变量，无需覆盖 */
    }
    [data-theme="dark"] .skill-card:hover {
      box-shadow: var(--card-shadow-hover);
    }
    [data-theme="dark"] .highlight-item,
    [data-theme="dark"] .sidebar-section {
      background: var(--bg-secondary);
      border-color: var(--border-light);
    }
    [data-theme="dark"] .glass-card {
      background: var(--glass-bg);
      border-color: var(--glass-border);
    }
    [data-theme="dark"] .project-visual {
      /* 使用CSS变量，无需覆盖 */
    }
    [data-theme="dark"] .project-card:hover {
      box-shadow: var(--card-shadow-hover);
    }
    [data-theme="dark"] .blog-card:hover {
      box-shadow: var(--card-shadow-hover);
    }
    [data-theme="dark"] .ai-chat-window {
      background: var(--bg-secondary);
      border-color: var(--border-light);
      box-shadow: var(--shadow-lg);
    }
    [data-theme="dark"] .ai-chat-header {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      border-bottom: 1px solid var(--glass-border);
    }
    [data-theme="dark"] .ai-message.bot {
      background: var(--bg-tertiary);
    }
    [data-theme="dark"] .ai-chat-input {
      background: var(--bg-tertiary);
      border-color: var(--border-color);
    }
    [data-theme="dark"] .ai-quick-btn {
      background: var(--bg-tertiary);
      border-color: var(--border-color);
    }
    [data-theme="dark"] .skill-icon {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
    }
    [data-theme="dark"] .product-icon {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
    }
    [data-theme="dark"] .ai-button {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-md);
    }
    [data-theme="dark"] .blog-card-image {
      background: var(--bg-gradient-card);
    }
    [data-theme="dark"] .project-visual::before {
      background: radial-gradient(circle at 30% 30%, rgba(41, 38, 61, 0.2) 0%, transparent 60%);
    }

    /* ========== 博客模块 ========== */
    .blog {
      background: var(--bg-primary);
    }
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .blog-card {
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      border: 1px solid var(--glass-border);
      box-shadow: var(--card-shadow);
    }
    .blog-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--card-shadow-hover);
    }
    .blog-card-image {
      width: 100%;
      height: 180px;
      background: var(--display-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      transition: background 0.3s ease;
    }
    /* 博客卡片主题样式已移至全局主题系统 */
    }
    /* 深色模式兼容 */
    [data-theme="dark"] .blog-theme-silver .blog-card-image {
      background: linear-gradient(135deg, #2c2c2e, #3a3a3c);
      border-bottom-color: rgba(255, 255, 255, 0.08);
    }
    [data-theme="dark"] .blog-theme-silver .blog-card-image::before {
      background: rgba(255, 255, 255, 0.05);
    }
    [data-theme="dark"] .blog-theme-blue .blog-card-image {
      background: linear-gradient(135deg, rgba(10, 132, 255, 0.15), rgba(90, 200, 250, 0.1));
    }
    .blog-card-content {
      padding: 24px;
    }
    .blog-card-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .blog-card-date {
      font-size: 13px;
      color: var(--text-secondary);
    }
    .blog-card-tag {
      font-size: 12px;
      color: var(--accent-blue);
      background: rgba(0, 113, 227, 0.1);
      padding: 2px 8px;
      border-radius: 980px;
    }
    .blog-card-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }
    .blog-card-desc {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* ========== 项目详情弹窗 ========== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all var(--transition-normal);
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal {
      background: var(--bg-primary);
      border-radius: var(--radius-xl);
      width: 90%;
      max-width: 800px;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(0.95) translateY(20px);
      transition: transform var(--transition-normal);
    }
    .modal-overlay.active .modal {
      transform: scale(1) translateY(0);
    }
    .modal-header {
      position: relative;
      padding: 32px 32px 0;
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-secondary);
      border: none;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition-fast);
    }
    .modal-close:hover {
      background: var(--border-color);
    }
    .modal-image {
      width: 100%;
      height: 300px;
      background: var(--display-gradient);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      margin-bottom: 24px;
    }
    .modal-body {
      padding: 0 32px 32px;
    }
    .modal-category {
      font-size: 14px;
      color: var(--accent-blue);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .modal-title {
      font-size: 32px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 16px;
      letter-spacing: -1px;
    }
    .modal-desc {
      font-size: 17px;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 24px;
    }
    .modal-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }
    .modal-tag {
      padding: 8px 16px;
      background: rgba(0, 113, 227, 0.1);
      color: var(--accent-blue);
      border-radius: 980px;
      font-size: 14px;
    }
    .modal-section-title {
      font-size: 20px;
