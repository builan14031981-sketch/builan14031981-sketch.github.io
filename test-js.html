      if (style !== 'default') {
        html.setAttribute('data-theme-style', style);
      }
      // 保存到localStorage
      localStorage.setItem('theme-style', style);

      document.querySelectorAll('.theme-style-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      clickedBtn.classList.add('active');
    }

    function openBlogModal(index) {
      const post = blogPosts[index];
      document.getElementById('blogModalImage').textContent = post.image;
      document.getElementById('blogModalCategory').textContent = post.category;
      document.getElementById('blogModalTitle').textContent = post.title;
      document.getElementById('blogModalContent').textContent = post.content;
      document.getElementById('blogModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeBlogModal() {
      document.getElementById('blogModal').classList.remove('active');
      document.body.style.overflow = '';
    }

      threshold: 0.1
    };

      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, observerOptions);

      aiChatMessages.appendChild(loadingDiv);

    function hideLoading() {
      const loading = document.getElementById('aiLoading');
      if (loading) loading.remove();

    // 调用API
    async function callAI(userMessage) {
      conversationHistory.push({ role: 'user', content: userMessage });

      try {
        // 创建fetch请求
        const fetchPromise = fetch(API_CONFIG.endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_CONFIG.token}`
          },
          body: JSON.stringify({
            model: API_CONFIG.model,
            messages: conversationHistory,
            temperature: 0.7,
            max_tokens: 800,
            enable_search: true
          })
        });

        // 15秒超时
        const timeoutPromise = new Promise((_, reject) => 
          setTimeout(() => reject(new Error('请求超时')), 15000)
        );

        const response = await Promise.race([fetchPromise, timeoutPromise]);

        if (!response.ok) {
          throw new Error(`API请求失败: ${response.status}`);
        }

        const data = await response.json();
        const aiReply = data.choices[0].message.content;
        
        // 添加到对话历史
        conversationHistory.push({ role: 'assistant', content: aiReply });
        
        // 限制历史长度
        if (conversationHistory.length > 21) {
          conversationHistory = [
            conversationHistory[0],
            ...conversationHistory.slice(-20)
          ];
        }

        return aiReply;
      } catch (error) {
        console.error('AI API错误:', error);
        if (error.message === '请求超时') {
          return '回复超时，请稍后再试或通过页脚联系方式联系严志辉';
