<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>严志辉 - AI辅助开发工程师</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --accent-blue: #0071e3;
      --text-primary: #1d1d1f;
      --text-secondary: #86868b;
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f7;
      --border-color: #d2d2d7;
    }
    
    [data-theme="dark"] {
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1a6;
      --bg-primary: #1c1c1e;
      --bg-secondary: #2c2c2e;
      --border-color: #38383a;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
    }
    
    /* 加载动画 */
    .page-loader {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-primary);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease;
    }
    .page-loader.loaded {
      opacity: 0;
      visibility: hidden;
    }
    .loader-logo {
      font-size: 48px;
      font-weight: 600;
      animation: fadeInUp 0.8s ease forwards;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* 导航栏 */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
    }
    .nav-logo { font-weight: 600; }
    .nav-links { display: flex; gap: 24px; list-style: none; }
    .nav-links a { color: var(--text-primary); text-decoration: none; font-size: 14px; }
    
    /* Hero */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 100px 20px;
    }
    .hero-title {
      font-size: 64px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .hero-subtitle {
      font-size: 24px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: var(--accent-blue);
      color: white;
      border-radius: 8px;
      text-decoration: none;
      margin: 0 8px;
    }
    
    /* 内容区 */
    .section {
      padding: 80px 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .section-title {
      font-size: 32px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--bg-secondary);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
    }
    .card h3 { margin-bottom: 8px; }
    .card p { color: var(--text-secondary); }
    
    /* 页脚 */
    .footer {
      background: var(--bg-secondary);
      padding: 40px 20px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!-- 加载动画 -->
  <div class="page-loader" id="pageLoader">
    <div class="loader-logo">YZH</div>
  </div>

  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="nav-logo">严志辉</div>
    <ul class="nav-links">
      <li><a href="#projects">项目</a></li>
      <li><a href="#blog">博客</a></li>
      <li><a href="about.html">关于</a></li>
      <li><button onclick="toggleTheme()">🌙</button></li>
    </ul>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <div>
      <h1 class="hero-title">严志辉</h1>
      <p class="hero-subtitle">AI辅助开发工程师</p>
      <a href="#projects" class="btn">查看项目</a>
      <a href="about.html" class="btn" style="background: transparent; color: var(--accent-blue); border: 1px solid var(--accent-blue);">关于我</a>
    </div>
  </section>

  <!-- 项目 -->
  <section class="section" id="projects">
    <h2 class="section-title">精选项目</h2>
    <div class="card">
      <h3>Electron智能便签工具</h3>
      <p>桌面端效率工具，支持多书签、主题切换、Mini Window</p>
    </div>
    <div class="card">
      <h3>本地AI助手系统</h3>
      <p>集成Ollama、DeepSeek、Qwen等模型的智能助手</p>
    </div>
    <div class="card">
      <h3>智能AI助手系统</h3>
      <p>可接入企业微信，支持知识库读取、联网搜索</p>
    </div>
  </section>

  <!-- 博客 -->
  <section class="section" id="blog">
    <h2 class="section-title">博客文章</h2>
    <div class="card">
      <a href="blog-ai-collaboration.html">从向AI提问，到与AI协作开发</a>
    </div>
    <div class="card">
      <a href="blog-ai-enterprise.html">从一台个人电脑到企业级AI助手</a>
    </div>
    <div class="card">
      <a href="blog-design-aesthetics.html">从喜欢苹果，到理解苹果</a>
    </div>
  </section>

  <!-- 页脚 -->
  <footer class="footer">
    <p>© 2026 严志辉</p>
    <p style="margin-top: 10px;">
      <a href="https://github.com/builan14031981-sketch">GitHub</a> · 
      <a href="https://www.douyin.com/user/self?from_tab_name=main">抖音</a>
    </p>
  </footer>

  <script>
    // 加载动画
    setTimeout(function() {
      document.getElementById('pageLoader').classList.add('loaded');
    }, 1500);
    
    // 主题切换
    function toggleTheme() {
      const html = document.documentElement;
      if (html.getAttribute('data-theme') === 'dark') {
        html.removeAttribute('data-theme');
      } else {
        html.setAttribute('data-theme', 'dark');
      }
    }
  </script>
</body>
</html>
